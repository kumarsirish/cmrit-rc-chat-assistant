[pytest]
markers =
    ragas: live RAGAS judge evaluation (needs Ollama + an ingested Chroma store; excluded by default, run with `make eval`)
    retrieval_eval: live retrieval-only IR metrics (needs an ingested Chroma store; excluded by default, run with `make test-retrieval-eval`)
addopts = -m "not ragas and not retrieval_eval"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
