# Named hyperparameter sets for scripts/run_experiment.py.
#
# Run one by name instead of typing out --set flags:
#
#   python scripts/run_experiment.py --overrides-file experiments.yaml --experiment low_threshold
#
# Each block is a flat mapping of "dotted.config.path: value" — the
# same paths --set accepts (anything under config.yaml's retrieval/
# embedding/chunking sections). Values are parsed to match the
# existing field's type (int/float/bool/str), same as --set.
#
# Add your own blocks freely; nothing here is read unless you pass
# --overrides-file/--experiment explicitly.

baseline:
  # Empty means "run exactly what config.yaml says" — useful as a
  # named zero-override run for comparison in the MLflow UI.

low_threshold:
  retrieval.min_reranker_score: 0.20

wide_top_k:
  retrieval.top_k: 8
  retrieval.mapped_document_primary_top_k: 3

lexical_heavy:
  retrieval.hybrid.dense_weight: 0.3
  retrieval.hybrid.lexical_weight: 0.7

alt_reranker:
  retrieval.rerank.model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
