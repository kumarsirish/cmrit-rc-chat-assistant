# Named hyperparameter sets for helper_scripts/run_experiment.py.
#
# Run one by name instead of typing out --set flags:
#
#   python helper_scripts/run_experiment.py --overrides-file config/experiments.yaml --experiment low_threshold
#
# Each block is a flat mapping of "dotted.config.path: value" — the
# same paths --set accepts (anything under config.yaml's retrieval/
# embedding/chunking sections). Values are parsed to match the
# existing field's type (int/float/bool/str), same as --set.
#
# Add your own blocks freely; nothing here is read unless you pass
# --overrides-file/--experiment explicitly.
#
# embedding.model_name/chunking.* overrides change what the index
# itself must contain, not just how it's searched — run_experiment.py
# detects that automatically and builds/reuses a dedicated,
# fingerprint-cached index under ./chroma-db-store/chroma_store_experiments/ instead of
# touching the shared ./chroma-db-store/chroma_store the live app reads (see
# _ensure_matching_index() in helper_scripts/run_experiment.py). The first run
# of a new embedding model will therefore take longer (it re-ingests
# once); later runs with the same setting reuse that cached index.

baseline:
  # Empty means "run exactly what config.yaml says" — useful as a
  # named zero-override run for comparison in the MLflow UI.

low_threshold:
  retrieval.min_reranker_score: 0.20

wide_top_k:
  retrieval.top_k: 8
  retrieval.mapped_document_primary_top_k: 3

lexical_heavy:
  retrieval.hybrid.dense_weight: 0.3
  retrieval.hybrid.lexical_weight: 0.7

alt_reranker:
  retrieval.rerank.model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

bge_base_embedding:
  # Stronger (and slower/bigger) embedding model than config.yaml's
  # default all-MiniLM-L6-v2 — triggers a one-time dedicated re-ingest
  # (see note above) so retrieval is actually scored against vectors
  # this model produced, not the default index.
  embedding.model_name: "BAAI/bge-base-en-v1.5"
