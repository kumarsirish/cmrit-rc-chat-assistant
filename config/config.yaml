# Configuration for this RAG application.
# All tunables live here so components can be swapped without touching code.

app:
  # Shown as the page title and intro text in the UI.
  name: "RC Assistant"
  description: "Ask questions about the documents that have been indexed. Answers are grounded only in those documents."
  # Clickable example questions shown in the chat sidebar. Empty means
  # none are shown; fill in questions relevant to whatever documents
  # this deployment indexes.
  example_queries: []
  # Shown when retrieval finds nothing above the relevance threshold.
  no_match_message: "I could not find any information about this query in the indexed documents."
  # Every chat session is attributed to this identity since there is no
  # real login yet — a placeholder, not a security boundary.
  default_user_email: "admin@example.com"

admin:
  # Shared password gating the Admin tab (document upload/supersede/
  # rebuild-index). Override with the RAG_ADMIN_PASSWORD env var instead
  # of editing this file.
  password: "change-me"

llm:
  # Which provider answers user questions: "ollama" or "groq".
  provider: "groq"

  ollama:
    base_url: "http://localhost:11434"
    #model: "llama3.2:3b"
    model: "llama3.1:8b"
    temperature: 0
    request_timeout_seconds: 300
    # CPU threads for Ollama inference; set to `nproc` (auto-detect undershoots on WSL2).
    num_thread: 8
    # Max generated tokens. Kept low to stay well under request_timeout_seconds
    # at this machine's ~3.8 tok/s CPU speed.
    num_predict: 220

  groq:
    model: "qwen/qwen3.8-27b"
    temperature: 0
    request_timeout_seconds: 300
    max_tokens: 800
    # Env var holding the Groq API key (this deployment uses GROQ_KEY).
    api_key_env: "GROQ_KEY"

embedding:
  # Local sentence-transformers model for embedding chunks and queries.
  # bge-base-en-v1.5 chosen over all-MiniLM-L6-v2 for better paraphrase matching.
  #
  # IMPORTANT: changing this requires re-running `make ingest` to rebuild
  # chroma_store — embeddings from different models aren't comparable.
  model_name: "BAAI/bge-base-en-v1.5"
  #model_name: "all-MiniLM-L6-v2"  # previous model; kept as fallback reference
  # Batch size for embedding chunks during ingestion.
  batch_size: 64

chroma:
  persist_directory: "./chroma-db-store/chroma_store"
  # Collection name is derived from app.name above, not set here — so
  # renaming app.name is the one place that changes which collection
  # this deployment reads/writes, even if several deployments share
  # one Chroma persist_directory.

documents:
  # Documents (PDF, Word, plain text, Excel) can be arranged category-wise
  # in subfolders under this directory (e.g. source_directory/"Leave
  # Policy"/*.pdf) or sit directly in it — both are picked up recursively.
  source_directory: "./knowledge_documents"
  # One record per document: category/upload_date/status bookkeeping
  # for documents added via the Admin UI, plus the topic/link fields
  # used to tag chunks and detect a query's topic at retrieval time.
  documents_file: "./config/documents.json"
  # Acronym -> full-phrase glossary, hand-maintained (not regenerated
  # by ingest). Used by rag/_03_routing/query_expander.py to expand
  # plain-language questions with institutional terms.
  glossary_file: "./config/glossary.json"
  # Subfolder name (under each category folder) a superseded document is
  # moved into; ingestion's directory scan skips anything under it.
  archived_subfolder_name: "_archived"
  # Records the last successful ingestion run's duration, so the Admin
  # tab's "Rebuild index" button can show an estimated time.
  ingestion_stats_file: "./config/ingestion_stats.json"

chunking:
  # Recursive splitter: paragraph breaks, then line breaks, sentence stops,
  # then hard character limit as a last resort.
  chunk_size: 800
  chunk_overlap: 120
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

retrieval:
  # Final number of chunks sent to the LLM. Applies directly as the
  # fallback search's cap; in FOCUSSED_CATEGORY/GLOBAL mode it's the
  # budget split between PRIMARY (matched document(s), up to
  # primary_top_k) and SECONDARY (same-scope fallback) — see
  # retrieval_service.py. Raised 5->8 per MLflow wide_top_k experiment.
  top_k: 8
  # Minimum cross-encoder reranker score to keep a chunk (below = refuse
  # rather than guess). Tuned to 0.35 against bge-reranker-v2-m3 (see
  # rerank.model) using real (question, chunk) pairs from
  # tests/evaluation-question-answers.json.
  min_reranker_score: 0.35
  # If nothing clears min_reranker_score, still return the single best
  # candidate (flagged low_confidence=True) as long as it scores at least
  # this; below it, treat the query as unanswerable. Callers must surface
  # low_confidence=True clearly to the user.
  low_confidence_min_score: 0.05
  # PRIMARY chunks are judged by dense cosine similarity instead of
  # reranker score, since the matched document(s) are already trusted
  # by topic match and the reranker can undervalue short/heading-like chunks.
  min_relevance_score: 0.40
  # Cap on PRIMARY chunks kept before remaining top_k slots go to SECONDARY.
  # Kept below top_k so PRIMARY can't consume the whole budget — raised
  # from 3 since PRIMARY can now span several matched documents at once,
  # not just one.
  primary_top_k: 4
  # Minimum query-topic cosine similarity (rag/_03_routing/topic_matcher.py) to
  # count as a topic match; below this, retrieval falls back to a plain search.
  topic_match_threshold: 0.5
  hybrid:
    # When enabled, dense + BM25 search run in parallel and are combined
    # via Reciprocal Rank Fusion; when disabled, search is dense-only.
    enabled: true
    # Chunks fetched from EACH of dense/lexical search before fusion.
    # Raised 10->15: PRIMARY can now span several matched documents at
    # once, so each one needs a fair share of the pool instead of
    # competing for what used to be sized for a single document.
    candidates: 15
    # Weight each method contributes to the fused RRF score.
    dense_weight: 0.5
    lexical_weight: 0.5
  rerank:
    # When enabled, over-fetch the candidate pool to `candidates`, score
    # each (question, chunk) pair with a cross-encoder, and keep the best
    # top_k. In PRIMARY search this can only reorder, never evict.
    enabled: true
    # Stronger than bge-reranker-base at matching conversational phrasings
    # to literal policy text; slower to load/score, so watch latency.
    model: "BAAI/bge-reranker-v2-m3"
    #model: "BAAI/bge-reranker-base"   # previous model; kept as fallback reference
    #model: "cross-encoder/ms-marco-MiniLM-L-6-v2" # pre-trained for small queries
    # Raised 10->20, above hybrid.candidates (15), so every chunk the
    # fused dense+BM25 pool already fetched gets a real cross-encoder
    # score — a smaller value here was silently dropping candidates
    # ranked just outside it (by RRF rank, not true relevance) before
    # they ever reached the reranker.
    candidates: 20

session:
  timeout_minutes: 5
  # Countdown warning shows this many seconds before the session resets.
  warning_seconds_before_timeout: 60
  # How many recent chat messages (user + assistant) are sent as context
  # for a new question, capped to bound prompt/generation growth.
  max_history_messages: 2

evaluation:
  # DeepEval judge: scores live pipeline answers against test_data_path using
  # a separate judge model (not the answer LLM, so it doesn't grade itself).
  # judge_provider: "ollama" (local), "groq" (needs llm.groq.api_key_env),
  # or "gemini" (needs GOOGLE_API_KEY).
  #judge_provider: "groq"
  #judge_model: "openai/gpt-oss-20b"
  judge_provider: "gemini"
  judge_model: "gemini-3.1-flash-lite"
  judge_temperature: 0
  # Generous timeout to absorb free-tier API queuing/backoff instead of
  # failing the row (a timeout becomes NaN and poisons the mean).
  judge_timeout_seconds: 300
  # Keep low for a free-tier key; DeepEval's default concurrency hits rate limits.
  judge_max_workers: 1
  test_data_path: "./tests/evaluation-question-answers.json"
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
  # Minimum mean score per metric (DeepEval metrics are [0, 1]) to pass.
  min_score: 0.5
  # Written by tests/_07_evaluation/test_judge.py after each `make eval`
  # run, so the UI can show latest scores without re-running evaluation.
  results_path: "./tests/test-results/judge_results.json"
  # Snapshot saved via `make save-eval-baseline`; later runs diff against it.
  baseline_path: "./tests/test-results/judge_baseline.json"

  retrieval:
    # tests/_07_evaluation/test_retrieval_eval.py: Recall/Precision/MRR/NDCG
    # @ retrieval.top_k against ground-truth relevant_sources, no LLM
    # involved (separate from the LLM-judged metrics above).
    min_recall: 0.6
    min_mrr: 0.5
    results_path: "./tests/test-results/retrieval_results.json"
    # Snapshot saved via `make save-eval-baseline`; later runs diff against it.
    baseline_path: "./tests/test-results/retrieval_baseline.json"

database:
  # Session/history storage in MySQL. Password can be overridden via the
  # RAG_DB_PASSWORD environment variable instead of editing this file.
  # The database name itself is derived from app.name above (not set
  # here), so each deployment's sessions/messages/timing stats stay in
  # their own database even if several deployments share one MySQL server.
  host: "127.0.0.1"
  port: 3306
  user: "sirkumar"
  password: "Issa123#"

