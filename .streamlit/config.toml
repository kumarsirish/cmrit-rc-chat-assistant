# Streamlit's dev file-watcher otherwise reloads/logs on every write
# Chroma makes to its on-disk database, which is noisy and irrelevant
# to app code changes.
[server]
folderWatchBlacklist = ["chroma-db-store"]

[client]
# Hides the "Deploy" button and the "⋮" app menu that Streamlit shows
# by default — this is an internal tool, not something end users
# should be offered to redeploy or fork.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#1E293B"
font = "\"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
baseFontSize = 16
baseRadius = "0.75rem"
